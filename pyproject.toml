[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-computer-use"
version = "0.1.0"
description = "Persistent Linux desktop control for MCP clients"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "5omeOtherGuy"}]
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]
requires-python = ">=3.12"
dependencies = ["mcp==1.30.0", "python-xlib==0.33"]

[project.urls]
Repository = "https://github.com/5omeOtherGuy/linux-computer-use"
Issues = "https://github.com/5omeOtherGuy/linux-computer-use/issues"

[project.scripts]
linux-computer-use = "linux_computer_use.server:main"

[tool.setuptools.packages.find]
include = ["linux_computer_use*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
