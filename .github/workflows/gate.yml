name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # PR runs share a group per PR and cancel superseded runs; every main push
  # gets its own group so no pending main run is replaced.
  group: gate-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: Install python3-websockets
        run: sudo apt-get update -q && sudo apt-get install -y -q python3-websockets
      - name: Gate
        run: scripts/gate
